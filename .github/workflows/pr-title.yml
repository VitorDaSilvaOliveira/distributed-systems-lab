name: PR title

# Squash merge turns the PR title into the commit on main, so it must follow Conventional Commits
# (release-please builds versions and the changelog from it).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  lint:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Reads only the PR metadata; never checks out the PR code (safe under pull_request_target).
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            build
            refactor
            perf
            test
            chore
            revert
          requireScope: false
