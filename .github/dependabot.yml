version: 2

# One grouped PR per ecosystem per week keeps the noise low.
# Java major versions and Spring Boot major/minor versions are architectural decisions
# (see docs/adr/0003-java-25-and-spring-boot-4.md): they are ignored here and upgraded through an ADR.
# The cooldown waits a few days after a release before proposing it, which avoids
# freshly published (possibly compromised or broken) versions.

updates:
  - package-ecosystem: "maven"
    directory: "/order-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 3
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"
    labels: ["type:dependencies"]

  - package-ecosystem: "docker"
    directory: "/order-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 3
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Tags carry the Java major version (e.g. 25-jdk): moving to another Java is an ADR.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The maven image is the frozen "before" picture (Dockerfile.naive) and the build stage of
      # Dockerfile, where its Maven version must match the Maven Wrapper (the build checks it):
      # update its tag and digest by hand together with the wrapper.
      - dependency-name: "maven"
    commit-message:
      prefix: "build(docker)"
    labels: ["type:dependencies"]

  - package-ecosystem: "docker-compose"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 3
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: "build(tools)"
    labels: ["type:dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:dependencies"]
